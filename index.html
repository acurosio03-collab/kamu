<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0720">
<title>UNLOCKED — A Little Something for You</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#0c0720; --bg2:#1b0f3d; --lav:#c9b8ff; --pink:#ff9ecb; --blue:#7fd4ff; --glow:#b48cff; --text:#f4efff;
  --glass:rgba(255,255,255,.08); --glass-b:rgba(255,255,255,.18);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg1);color:var(--text);font-family:'Poppins',system-ui,sans-serif}
body{background:radial-gradient(ellipse at 50% 20%,var(--bg2),var(--bg1) 70%)}
#stars{position:fixed;inset:0;width:100%;height:100%;z-index:0}
#hearts{position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden}
.heart{position:absolute;bottom:-30px;opacity:0;animation:floatUp linear forwards;filter:drop-shadow(0 0 6px var(--pink))}
@keyframes floatUp{0%{transform:translateY(0) translateX(0);opacity:0}10%{opacity:.8}100%{transform:translateY(-110vh) translateX(var(--dx));opacity:0}}
.planet{position:fixed;border-radius:50%;z-index:0;pointer-events:none;opacity:.55;animation:drift 40s ease-in-out infinite alternate}
.p1{width:130px;height:130px;top:8%;left:-40px;background:radial-gradient(circle at 30% 30%,#ffd1ec,#a56bff 60%,#3a1b7a);box-shadow:0 0 40px rgba(180,140,255,.5)}
.p2{width:90px;height:90px;bottom:10%;right:-25px;background:radial-gradient(circle at 30% 30%,#d6f3ff,#5aa9ff 60%,#1b2e7a);box-shadow:0 0 36px rgba(127,212,255,.5);animation-duration:55s}
.p2::after{content:"";position:absolute;left:-30%;top:42%;width:160%;height:16%;border:2px solid rgba(255,255,255,.35);border-radius:50%;transform:rotate(-18deg)}
@keyframes drift{from{transform:translate(0,0) rotate(0)}to{transform:translate(30px,40px) rotate(20deg)}}

#progress{position:fixed;top:0;left:0;right:0;height:4px;background:rgba(255,255,255,.08);z-index:50}
#bar{height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--glow),var(--pink));box-shadow:0 0 10px var(--glow);transition:width .6s ease}
#topbar{position:fixed;top:10px;right:10px;display:flex;gap:8px;z-index:50;padding-top:env(safe-area-inset-top)}
.ibtn{width:42px;height:42px;border-radius:50%;border:1px solid var(--glass-b);background:var(--glass);color:var(--text);font-size:18px;cursor:pointer;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:transform .2s,background .2s}
.ibtn:hover{background:rgba(255,255,255,.18)}.ibtn:active{transform:scale(.9)}
.ibtn.off{opacity:.45;text-decoration:line-through}

.page{position:fixed;inset:0;z-index:5;display:none;overflow-y:auto;overflow-x:hidden;padding:64px 18px 40px;-webkit-overflow-scrolling:touch}
.page.active{display:block;animation:pageIn .8s ease both}
.page.leaving{display:block;animation:pageOut .45s ease both;pointer-events:none}
@keyframes pageIn{from{opacity:0;transform:scale(1.04);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}
@keyframes pageOut{to{opacity:0;transform:scale(.96);filter:blur(8px)}}
.wrap{min-height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px}
h1,h2{font-family:'Cormorant Garamond',serif;font-weight:700;margin:0;letter-spacing:.5px}
h1{font-size:clamp(30px,8vw,46px);background:linear-gradient(90deg,var(--lav),var(--pink),var(--blue));-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font-size:clamp(24px,6.5vw,34px);color:var(--lav)}
p{margin:0;line-height:1.6}
.sub{color:rgba(244,239,255,.78);font-size:15px}
.glass{background:var(--glass);border:1px solid var(--glass-b);border-radius:22px;padding:18px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 8px 40px rgba(0,0,0,.35),inset 0 0 30px rgba(180,140,255,.08);width:100%}
.btn{border:0;cursor:pointer;font-family:inherit;font-weight:600;font-size:15px;color:#1a0b3a;padding:14px 26px;border-radius:999px;background:linear-gradient(135deg,var(--pink),var(--lav) 55%,var(--blue));box-shadow:0 0 22px rgba(180,140,255,.55);transition:transform .2s,box-shadow .2s;position:relative;overflow:hidden}
.btn:hover{transform:translateY(-2px);box-shadow:0 0 32px rgba(255,158,203,.7)}
.btn:active{transform:scale(.95)}
.btn.ghost{background:var(--glass);color:var(--text);border:1px solid var(--glass-b);box-shadow:none}
.btn[disabled]{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.backlink{position:fixed;top:12px;left:12px;z-index:50;padding-top:env(safe-area-inset-top)}
.backlink .ibtn{font-size:16px}

/* P1 gift */
.gift{position:relative;width:150px;height:150px;margin:10px auto;cursor:pointer;animation:bob 3s ease-in-out infinite;filter:drop-shadow(0 0 28px rgba(180,140,255,.8));border:0;background:none;padding:0}
@keyframes bob{50%{transform:translateY(-12px)}}
.gift .body{position:absolute;bottom:0;left:10px;right:10px;height:95px;background:linear-gradient(135deg,#8a5cff,#c9b8ff);border-radius:8px}
.gift .lid{position:absolute;top:18px;left:0;right:0;height:42px;background:linear-gradient(135deg,#a77bff,#ffb3d9);border-radius:8px;transition:transform .9s cubic-bezier(.3,1.4,.5,1),opacity .9s;z-index:2}
.gift .rv{position:absolute;left:50%;bottom:0;width:22px;height:95px;transform:translateX(-50%);background:var(--pink);z-index:1}
.gift .lid::after{content:"";position:absolute;left:50%;top:0;width:22px;height:100%;transform:translateX(-50%);background:var(--pink)}
.gift .bow{position:absolute;top:-6px;left:50%;transform:translateX(-50%);font-size:34px;z-index:3;transition:transform .9s,opacity .9s}
.gift.open{animation:none}
.gift.open .lid{transform:translateY(-70px) rotate(-18deg);opacity:0}
.gift.open .bow{transform:translate(-50%,-90px) scale(1.4);opacity:0}
.gift .light{position:absolute;left:50%;top:50%;width:10px;height:10px;border-radius:50%;background:#fff;opacity:0;transform:translate(-50%,-50%);z-index:0}
.gift.open .light{animation:flash 1.1s ease forwards}
@keyframes flash{50%{opacity:1;box-shadow:0 0 120px 80px rgba(255,200,240,.9)}100%{opacity:0}}
.tw{min-height:3.4em}
.cursor::after{content:"▍";animation:blink 1s steps(2) infinite;opacity:.7}
@keyframes blink{50%{opacity:0}}
.pt{position:fixed;pointer-events:none;z-index:99;font-size:16px;animation:burst 1s ease-out forwards}
@keyframes burst{to{transform:translate(var(--x),var(--y)) scale(.3) rotate(var(--r));opacity:0}}
.tap{position:fixed;width:20px;height:20px;border-radius:50%;border:2px solid var(--lav);pointer-events:none;z-index:98;animation:tapr .6s ease-out forwards}
@keyframes tapr{from{transform:translate(-50%,-50%) scale(.3);opacity:1}to{transform:translate(-50%,-50%) scale(3);opacity:0}}

/* P2 portals */
.portals{display:flex;flex-direction:column;gap:14px;width:100%}
.portal{position:relative;border:0;cursor:pointer;color:var(--text);font-family:inherit;font-size:16px;font-weight:500;padding:20px;border-radius:999px;background:radial-gradient(ellipse at center,rgba(180,140,255,.35),rgba(60,30,130,.35));border:1px solid var(--glass-b);overflow:hidden;transition:transform .25s,box-shadow .25s}
.portal::before{content:"";position:absolute;inset:-60%;background:conic-gradient(from 0deg,transparent,rgba(127,212,255,.55),transparent 40%,rgba(255,158,203,.55),transparent 80%);animation:spin 6s linear infinite;z-index:0}
.portal::after{content:"";position:absolute;inset:2px;border-radius:999px;background:rgba(14,7,35,.82);z-index:0}
.portal span{position:relative;z-index:1}
.portal:hover{transform:scale(1.03);box-shadow:0 0 30px rgba(180,140,255,.6)}
.portal:active{transform:scale(.95)}
.portal.sel{box-shadow:0 0 36px rgba(255,158,203,.8)}
@keyframes spin{to{transform:rotate(360deg)}}
.react{min-height:3.2em;color:var(--pink);font-size:15px}

/* P3 quiz */
.qcount{font-size:12px;letter-spacing:2px;color:var(--blue)}
.qtext{font-family:'Cormorant Garamond',serif;font-size:clamp(22px,6vw,28px);font-weight:700;line-height:1.25}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.opt{text-align:left;font-family:inherit;font-size:14.5px;color:var(--text);padding:14px 16px;border-radius:16px;border:1px solid var(--glass-b);background:var(--glass);cursor:pointer;transition:transform .2s,background .2s,border-color .2s}
.opt:hover{background:rgba(255,255,255,.16)}
.opt:active{transform:scale(.97)}
.opt.sel{border-color:var(--pink);background:rgba(255,158,203,.18);box-shadow:0 0 18px rgba(255,158,203,.35)}

/* P4 envelopes */
.envs{display:flex;flex-direction:column;gap:12px;width:100%}
.env{position:relative;display:flex;align-items:center;gap:14px;text-align:left;font-family:inherit;color:var(--text);cursor:pointer;border:1px solid var(--glass-b);background:var(--glass);border-radius:18px;padding:14px 16px;transition:transform .2s,box-shadow .3s;animation:pulse 3s ease-in-out infinite}
.env:nth-child(2){animation-delay:.5s}.env:nth-child(3){animation-delay:1s}
@keyframes pulse{50%{box-shadow:0 0 22px rgba(180,140,255,.55)}}
.env:active{transform:scale(.97)}
.env .ic{font-size:32px;filter:drop-shadow(0 0 8px var(--pink))}
.env b{display:block;font-size:15px}.env small{color:rgba(244,239,255,.65)}
.env.done{animation:none;border-color:var(--blue);opacity:.85}
.env.done .ic{filter:drop-shadow(0 0 8px var(--blue))}
.modal{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(8,4,24,.78);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.modal.show{display:flex;animation:pageIn .5s ease both}
.letter{max-width:460px;width:100%;max-height:86vh;overflow:auto;text-align:left;background:linear-gradient(160deg,rgba(255,255,255,.14),rgba(180,140,255,.12));border:1px solid var(--glass-b);border-radius:24px;padding:24px;box-shadow:0 0 60px rgba(180,140,255,.4);animation:rise .7s cubic-bezier(.2,1.2,.4,1)}
@keyframes rise{from{transform:translateY(60px) scale(.85);opacity:0}}
.letter h2{margin-bottom:10px;font-size:26px}
.letter p{font-size:15.5px;min-height:5em}
.letter .extra{margin-top:12px;color:var(--pink);font-size:14px}
.counter{font-size:13px;color:var(--blue)}

/* P5 final */
.scene{position:relative;width:240px;height:240px;margin:0 auto;animation:cam 14s ease-in-out infinite alternate}
@keyframes cam{from{transform:scale(1) rotate(-2deg)}to{transform:scale(1.12) rotate(3deg)}}
.core{position:absolute;left:50%;top:50%;font-size:64px;transform:translate(-50%,-50%);animation:beat 1.6s ease-in-out infinite;filter:drop-shadow(0 0 22px var(--pink)) drop-shadow(0 0 50px var(--glow))}
@keyframes beat{50%{transform:translate(-50%,-50%) scale(1.18)}}
.orbit{position:absolute;inset:0;border:1px dashed rgba(201,184,255,.4);border-radius:50%;animation:spin 9s linear infinite}
.orbit i{position:absolute;top:-13px;left:50%;margin-left:-13px;width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#d6f3ff,#6aa8ff 60%,#233b9a);box-shadow:0 0 16px var(--blue)}
.orbit.o2{inset:38px;animation-duration:5s;animation-direction:reverse}
.orbit.o2 i{width:16px;height:16px;margin-left:-8px;top:-8px;background:radial-gradient(circle at 30% 30%,#ffe0f1,#ff8cc2 60%,#8a2d6a);box-shadow:0 0 14px var(--pink)}
.lines{min-height:200px;display:flex;flex-direction:column;gap:12px;align-items:center}
.lines p{opacity:0;transform:translateY(10px);transition:opacity 1s,transform 1s;font-size:16px}
.lines p.show{opacity:1;transform:none}
.lines p.big{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:500;color:var(--lav)}
.lines p.sign{font-family:'Cormorant Garamond',serif;font-size:30px;font-style:italic;color:var(--pink);text-shadow:0 0 18px var(--pink)}
.lines p.small{font-size:13px;color:rgba(244,239,255,.65);font-style:italic}

/* P6 quest */
.field{width:100%;text-align:left}
.field label{display:block;font-size:13px;color:var(--blue);margin:12px 0 6px;letter-spacing:.5px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-family:inherit;font-size:13.5px;color:var(--text);padding:9px 14px;border-radius:999px;border:1px solid var(--glass-b);background:var(--glass);cursor:pointer;transition:all .2s}
.chip:active{transform:scale(.93)}
.chip.sel{background:linear-gradient(135deg,rgba(255,158,203,.45),rgba(127,212,255,.35));border-color:var(--pink);box-shadow:0 0 14px rgba(255,158,203,.45)}
input[type=text],input[type=date]{width:100%;font-family:inherit;font-size:15px;color:var(--text);background:rgba(255,255,255,.07);border:1px solid var(--glass-b);border-radius:14px;padding:12px 14px;outline:none;color-scheme:dark}
input:focus{border-color:var(--pink);box-shadow:0 0 14px rgba(255,158,203,.35)}
.ticket{margin-top:6px;border-radius:20px;padding:18px;text-align:left;background:linear-gradient(135deg,rgba(255,158,203,.2),rgba(127,212,255,.16));border:1px dashed var(--lav);position:relative}
.ticket h3{margin:0 0 8px;font-family:'Cormorant Garamond',serif;font-size:22px;color:var(--pink)}
.ticket li{list-style:none;margin:4px 0;font-size:14.5px}
.msgbox{width:100%;text-align:left;font-size:14px;white-space:pre-wrap;line-height:1.55;background:rgba(0,0,0,.25);border-radius:14px;padding:14px;border:1px solid var(--glass-b)}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(30px);background:rgba(30,15,70,.95);border:1px solid var(--lav);padding:10px 18px;border-radius:999px;font-size:14px;z-index:120;opacity:0;transition:all .35s;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%)}
.hidden{display:none!important}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .heart,.planet{display:none}
}
</style>
</head>
<body>
<canvas id="stars" aria-hidden="true"></canvas>
<div class="planet p1" aria-hidden="true"></div>
<div class="planet p2" aria-hidden="true"></div>
<div id="hearts" aria-hidden="true"></div>
<div id="progress"><div id="bar"></div></div>

<div class="backlink"><button class="ibtn hidden" id="backBtn" aria-label="Kembali">←</button></div>
<div id="topbar">
  <button class="ibtn off" id="musicBtn" aria-label="Musik latar" title="Musik">🎵</button>
  <button class="ibtn" id="sfxBtn" aria-label="Efek suara" title="Efek suara">🔔</button>
  <button class="ibtn" id="restartBtn" aria-label="Ulangi dari awal" title="Ulangi dari awal">↺</button>
</div>

<!-- PAGE 0 -->
<section class="page" id="page0"><div class="wrap">
  <p class="counter" id="toLine"></p>
  <h1 id="t0a"></h1>
  <p class="sub tw" id="t0b"></p>
  <button class="gift" id="gift" aria-label="Buka hadiah">
    <span class="light"></span><span class="body"></span><span class="rv"></span><span class="lid"></span><span class="bow">🎀</span>
  </button>
  <button class="btn" id="openGift">Buka hadiah kecil ini ✨</button>
</div></section>

<!-- PAGE 1 -->
<section class="page" id="page1"><div class="wrap">
  <h2>The Secret Gate</h2>
  <p class="sub">Pilih satu portal. Semuanya tetap menuju ke tempat yang sama, kok.</p>
  <div class="portals" id="portals"></div>
  <p class="react" id="gateReact"></p>
  <button class="btn hidden" id="gateNext">Masuk ke portal →</button>
</div></section>

<!-- PAGE 2 -->
<section class="page" id="page2"><div class="wrap">
  <h2>Friendship Interrogation</h2>
  <div class="glass">
    <p class="qcount" id="qcount"></p>
    <p class="qtext" id="qtext"></p>
    <div class="opts" id="opts"></div>
    <p class="react" id="qreact" style="margin-top:14px"></p>
  </div>
  <div class="row">
    <button class="btn ghost" id="qPrev">← Sebelumnya</button>
    <button class="btn" id="qNext" disabled>Lanjut →</button>
  </div>
</div></section>

<!-- PAGE 3 -->
<section class="page" id="page3"><div class="wrap">
  <h2>Three Secret Envelopes</h2>
  <p class="sub">Buka satu per satu. Boleh dibaca ulang kapan saja.</p>
  <div class="envs" id="envs"></div>
  <p class="counter" id="envCount"></p>
  <button class="btn" id="envNext" disabled>Buka semua amplop dulu 🔒</button>
</div></section>

<!-- PAGE 4 -->
<section class="page" id="page4"><div class="wrap">
  <div class="scene" aria-hidden="true">
    <div class="orbit"><i></i></div><div class="orbit o2"><i></i></div><div class="core">💗</div>
  </div>
  <div class="lines" id="lines"></div>
  <div class="row" id="finalBtns">
    <button class="btn ghost" id="skipLines">Lewati animasi</button>
  </div>
  <div class="row hidden" id="finalActions">
    <button class="btn ghost" id="copyClose">Salin pesan penutup 📋</button>
    <button class="btn" id="toQuest">Oke, sekarang kita bikin kenangan beneran?</button>
  </div>
</div></section>

<!-- PAGE 5 -->
<section class="page" id="page5"><div class="wrap">
  <h2>One Real-Life Quest</h2>
  <p class="sub">Santai aja, ini cuma rancangan. Boleh diubah, boleh didiskusikan.</p>
  <div class="glass">
    <div class="field"><label>Mau ngapain?</label><div class="chips" id="chAct"></div></div>
    <div class="field"><label>Makanannya?</label><div class="chips" id="chFood"></div></div>
    <div class="field hidden" id="foodOtherBox"><label>Makanan lainnya</label><input type="text" id="foodOther" maxlength="40" placeholder="Tulis makanan favorit"></div>
    <div class="field"><label>Tanggal yang diinginkan (boleh dikosongkan)</label><input type="date" id="qDate"></div>
    <div class="field"><label>Tempat yang diinginkan (boleh dikosongkan)</label><input type="text" id="qPlace" maxlength="60" placeholder="Misal: tempat yang belum pernah dicoba"></div>
  </div>
  <div class="ticket" id="ticket" style="width:100%"></div>
  <div class="row">
    <button class="btn" id="makeWA">Buat pesan WhatsApp</button>
    <button class="btn ghost" id="decideLater">Nanti tentuin bareng aja</button>
  </div>
  <div class="glass hidden" id="msgPanel">
    <p class="sub" id="msgNote" style="margin-bottom:10px"></p>
    <div class="msgbox" id="msgBox"></div>
    <div class="row" style="margin-top:12px">
      <button class="btn" id="sendWA">Kirim lewat WhatsApp</button>
      <button class="btn ghost" id="copyMsg">Salin pesan</button>
    </div>
  </div>
  <button class="btn ghost" id="endRestart">Ulangi pengalaman dari awal ↺</button>
</div></section>

<div class="modal" id="modal" role="dialog" aria-modal="true">
  <div class="letter">
    <h2 id="mTitle"></h2>
    <p id="mText"></p>
    <p class="extra hidden" id="mExtra"></p>
    <div class="row" style="margin-top:16px">
      <button class="btn ghost" id="mReread">Baca ulang ↻</button>
      <button class="btn" id="mClose">Tutup amplop</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
/* =========================================================
   KONFIGURASI — ubah bagian ini saja untuk personalisasi
   ========================================================= */

  opening: {

  },
  gate: [

    { label: "Agak kepo.", reply: "Kepo level sedang terdeteksi. Aman, di dalam nggak ada jebakan. Kayaknya. 👀" },
    { label: "Udah, buka aja! 😭", reply: "Gas! Pintunya hampir jebol dari tadi. Sabar, portalnya juga punya perasaan." }
  ],
  envelopes: [
    { icon: "💌", title: "Hal kecil yang aku perhatikan.",
      text: "Kadang hal kecil dari seseorang justru yang bikin dia terasa berbeda. Bukan karena dia harus selalu sempurna, tapi karena cara dia menjadi dirinya sendiri." },
    { icon: "💜", title: "Kenapa ngobrol sama kamu menyenangkan.",
      text: "Lucu ya, obrolan kadang nggak harus penting buat jadi menyenangkan. Kadang topiknya random, kadang nggak jelas arahnya, tapi justru itu yang bikin seru." },

let ac = null, master = null, musicTimer = null, musicGain = null;
function initAudio() {
  if (ac) { if (ac.state === "suspended") ac.resume(); return; }
  const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
  ac = new AC(); master = ac.createGain(); master.gain.value = 1; master.connect(ac.destination);
  musicGain = ac.createGain(); musicGain.gain.value = 0; musicGain.connect(master);
}
function blip(f = 660, d = .12, type = "sine", vol = CONFIG.sfx.volume) {
  if (!state.sfxOn) return; initAudio(); if (!ac) return;
  const o = ac.createOscillator(), g = ac.createGain(); o.type = type; o.frequency.value = f;
  g.gain.setValueAtTime(vol, ac.currentTime); g.gain.exponentialRampToValueAtTime(.0001, ac.currentTime + d);
  o.connect(g); g.connect(master); o.start(); o.stop(ac.currentTime + d);
}
const sfx = { tap: () => blip(720, .08), ok: () => { blip(660, .1); setTimeout(() => blip(990, .18), 90); }, open: () => { [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => blip(f, .3, "triangle"), i * 90)); } };
const SCALE = [261.6, 311.1, 349.2, 392, 466.2, 523.3, 622.3];
function startMusic() {
  initAudio(); if (!ac) return;
  musicGain.gain.cancelScheduledValues(ac.currentTime); musicGain.gain.linearRampToValueAtTime(CONFIG.music.volume, ac.currentTime + 1.5);
  if (musicTimer) return; let i = 0;
  const note = () => {
    const f = SCALE[(i * 3 + (i >> 2)) % SCALE.length] * (i % 8 === 0 ? .5 : 1);
    const o = ac.createOscillator(), g = ac.createGain(); o.type = "sine"; o.frequency.value = f;
    g.gain.setValueAtTime(0, ac.currentTime); g.gain.linearRampToValueAtTime(.9, ac.currentTime + .15); g.gain.exponentialRampToValueAtTime(.001, ac.currentTime + 2.4);
    o.connect(g); g.connect(musicGain); o.start(); o.stop(ac.currentTime + 2.5); i++;
  };
  note(); musicTimer = setInterval(note, 900);
}
function stopMusic() { if (!ac) return; musicGain.gain.cancelScheduledValues(ac.currentTime); musicGain.gain.linearRampToValueAtTime(0, ac.currentTime + .6); clearInterval(musicTimer); musicTimer = null; }
function setMusic(on) { state.musicOn = on; $("musicBtn").classList.toggle("off", !on); on ? startMusic() : stopMusic(); }

const cv = $("stars"), cx = cv.getContext("2d"); let stars = [], W, H;
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight;
  cv.width = W * dpr; cv.height = H * dpr; cx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const n = Math.min(110, Math.floor(W * H / 9000));
  stars = Array.from({ length: n }, () => ({ x: Math.random() * W, y: Math.random() * H, r: Math.random() * 1.4 + .3, p: Math.random() * 6.28, s: Math.random() * .02 + .005, v: Math.random() * .12 + .02 }));
}
function drawStars() {
  cx.clearRect(0, 0, W, H);
  for (const s of stars) {
    s.p += s.s; s.y += reduced ? 0 : s.v; if (s.y > H) { s.y = -2; s.x = Math.random() * W; }
    cx.globalAlpha = .35 + .65 * Math.abs(Math.sin(s.p)); cx.fillStyle = "#fff";
    cx.beginPath(); cx.arc(s.x, s.y, s.r, 0, 6.283); cx.fill();
  }
  cx.globalAlpha = 1; if (!document.hidden) requestAnimationFrame(drawStars);
}
document.addEventListener("visibilitychange", () => { if (!document.hidden) requestAnimationFrame(drawStars); });
addEventListener("resize", resize); resize(); requestAnimationFrame(drawStars);

if (!reduced) {
  const hl = $("hearts"); const em = ["💗", "💜", "✨", "💫", "🤍"];
  setInterval(() => {
    if (document.hidden || hl.children.length > 10) return;
    const h = document.createElement("span"); h.className = "heart"; h.textContent = em[Math.floor(Math.random() * em.length)];
    h.style.left = Math.random() * 100 + "%"; h.style.fontSize = 10 + Math.random() * 12 + "px";
    h.style.setProperty("--dx", (Math.random() * 80 - 40) + "px"); h.style.animationDuration = 9 + Math.random() * 7 + "s";
    hl.appendChild(h); setTimeout(() => h.remove(), 17000);
  }, 1400);
}
function burst(x, y, n = 16, set = ["✨", "💗", "💜", "⭐", "💫"]) {
  if (reduced) return;
  for (let i = 0; i < n; i++) {
    const p = document.createElement("span"); p.className = "pt"; p.textContent = set[i % set.length];
    const a = Math.random() * 6.283, d = 50 + Math.random() * 110;
    p.style.left = x + "px"; p.style.top = y + "px"; p.style.setProperty("--x", Math.cos(a) * d + "px"); p.style.setProperty("--y", Math.sin(a) * d + "px"); p.style.setProperty("--r", Math.random() * 360 + "deg");
    document.body.appendChild(p); setTimeout(() => p.remove(), 1000);
  }
}
document.addEventListener("pointerdown", e => {
  if (reduced) return; const t = document.createElement("span"); t.className = "tap"; t.style.left = e.clientX + "px"; t.style.top = e.clientY + "px";
  document.body.appendChild(t); setTimeout(() => t.remove(), 600);
});
function burstFrom(el, n) { const r = el.getBoundingClientRect(); burst(r.left + r.width / 2, r.top + r.height / 2, n); }

/* Typewriter yang bisa dibatalkan */
const typers = new WeakMap();
function typeText(el, text, speed = 28) {
  return new Promise(res => {
    clearInterval(typers.get(el)); el.textContent = "";
    if (reduced) { el.textContent = text; el.classList.remove("cursor"); return res(); }
    let i = 0; el.classList.add("cursor");
    const id = setInterval(() => { el.textContent = text.slice(0, ++i); if (i >= text.length) { clearInterval(id); el.classList.remove("cursor"); res(); } }, speed);
    typers.set(el, id);
  });
}

}

  Object.assign(state, { gate: null, quiz: [null, null, null], qi: 0, env: [false, false, false], finalDone: false, act: null, food: null, foodOther: "" });
  $("qDate").value = ""; $("qPlace").value = ""; $("foodOther").value = ""; $("msgPanel").classList.add("hidden"); sfx.tap(); go(0);
}
$("restartBtn").onclick = restart;

/* ---------- Mulai ---------- */
go(0);
if (CONFIG.music.enabledByDefault) { document.addEventListener("pointerdown", function once() { setMusic(true); document.removeEventListener("pointerdown", once); }); }
</script>
